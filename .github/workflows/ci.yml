name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    # The name does not list the steps: branch protection requires the check by
    # name, and a name that enumerates steps goes stale when one is added.
    name: API checks
    runs-on: ubuntu-latest

    services:
      db:
        # The same major version as docker-compose.yml.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: smartbudget
          POSTGRES_PASSWORD: smartbudget
          POSTGRES_DB: smartbudget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartbudget -d smartbudget"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A throwaway credential for the service above; it guards nothing.
      DATABASE_URL: postgresql+psycopg://smartbudget:smartbudget@localhost:5432/smartbudget

    steps:
      - uses: actions/checkout@v7

      # .python-version is the one place the version is written, so this
      # workflow and a development machine cannot quietly disagree about it.
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify the lockfiles are what their .in files produce
        # Fails when an .in changed without regenerating, or a hand edit dropped
        # a package or a marker — edits that still install here on Linux, so no
        # other step can tell. The plain form keeps existing pins, so a version
        # moved by hand to another valid one passes; an untouched branch
        # regenerates byte for byte.
        run: |
          python_version="$(cat .python-version)"
          uv pip compile -q --universal --python-version "$python_version" requirements.in -o requirements.txt
          uv pip compile -q --universal --python-version "$python_version" requirements-dev.in -o requirements-dev.txt
          if ! git diff --exit-code -- requirements.txt requirements-dev.txt; then
            echo "::error::A lockfile is not what its .in file produces. Regenerate it with the commands in CONTRIBUTING.md."
            exit 1
          fi

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      # Migrations run as an explicit step, never on start (ADR-004).
      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify the models and the migrations agree
        # A model changed without its migration passes every test that never
        # touches the new column; this is the step that can tell.
        run: alembic check

      - name: Verify the migrations reverse cleanly
        # A downgrade that never ran is only found broken on the day it is
        # needed.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Test
        run: pytest
